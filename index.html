<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Tiến độ nhắc việc</title></head>
<body style="margin:0;font:15px system-ui,sans-serif;color:#666;padding:28px;background:#f4f5f7">Đang tải trang theo dõi…
<script>
(async()=>{const h=new URLSearchParams(location.hash.slice(1)),g=h.get('g'),u=h.get('u');let html='';
if(!g){document.body.textContent='Link thiếu mã. Nhắn /tiendo cho bot TL MrBoo để lấy link.';return}
try{const r=await fetch('https://api.github.com/gists/'+g,{cache:'no-store'});if(r.ok){const j=await r.json(),f=j.files['app.html'];if(f)html=f.truncated?await (await fetch(f.raw_url)).text():f.content}}catch(e){}
if(!html&&u){try{const r=await fetch('https://gist.githubusercontent.com/'+u+'/'+g+'/raw/app.html?t='+Date.now());if(r.ok)html=await r.text()}catch(e){}}
if(!html){document.body.textContent='Không tải được trang (mạng hoặc GitHub tạm giới hạn). Thử lại sau 1–2 phút.';return}
document.open();document.write(html);document.close()})();
</script></body></html>
